name: CI

# Runs on every push and PR against main/develop.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR — saves runner minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND
  # ═══════════════════════════════════════════════════════════════════════════
  backend-lint:
    name: Backend — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npx eslint . --ext .js,.jsx --max-warnings 0
      - name: Syntax check server.js
        run: node -c server.js
      - name: Syntax check seed.js
        run: node -c seed.js

  backend-test:
    name: Backend — unit + integration tests
    runs-on: ubuntu-latest
    needs: [backend-lint]
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run Jest tests with coverage
        run: npx jest --ci --coverage --forceExit
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/ruaitech_ci_test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  backend-audit:
    name: Backend — security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Audit for high/critical vulnerabilities
        run: npm audit --audit-level=high
        # Fails the job if high/critical vulns are found

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-lint:
    name: Frontend — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: ESLint
        run: npx eslint src --ext .js,.jsx --max-warnings 10
        continue-on-error: true  # advisory — don't block on lint warnings yet

  frontend-test:
    name: Frontend — unit tests
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Run Vitest tests with coverage
        run: npx vitest run --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  frontend-build:
    name: Frontend — production build
    runs-on: ubuntu-latest
    needs: [frontend-test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://api.placeholder.invalid
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  frontend-audit:
    name: Frontend — security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit for high/critical vulnerabilities
        run: npm audit --audit-level=high
        # Fails the job if high/critical vulns are found

  # ═══════════════════════════════════════════════════════════════════════════
  # TECH HUB
  # ═══════════════════════════════════════════════════════════════════════════
  tech-hub-build:
    name: Tech Hub — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tech-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tech-hub/package-lock.json
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: placeholder
          PUBLIC_SANITY_DATASET: production
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tech-hub-dist
          path: tech-hub/dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # E2E TESTS (Cypress)
  # ═══════════════════════════════════════════════════════════════════════════
  e2e-test:
    name: E2E — Cypress tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Backend ──
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        run: node migrations/migrate.js up
        env:
          MONGO_URI: mongodb://localhost:27017/ruaitech_ci
          JWT_SECRET: ci-test-secret-not-for-production
          NODE_ENV: test

      - name: Seed test database
        working-directory: backend
        run: node seeds/seed-test.js
        env:
          MONGO_URI: mongodb://localhost:27017/ruaitech_ci
          JWT_SECRET: ci-test-secret-not-for-production
          NODE_ENV: test

      - name: Start backend server
        working-directory: backend
        run: |
          nohup node server.js > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
        env:
          MONGO_URI: mongodb://localhost:27017/ruaitech_ci
          JWT_SECRET: ci-test-secret-not-for-production
          PORT: 5001
          NODE_ENV: test
          MPESA_ENV: sandbox
          CLIENT_URL: http://localhost:3000

      - name: Wait for backend to be healthy
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:5001/api/health; do sleep 2; done'

      # ── Frontend ──
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          nohup npx vite --port 3000 --host 0.0.0.0 > /tmp/frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> $GITHUB_ENV
        env:
          VITE_API_URL: http://localhost:5001

      - name: Wait for frontend to be ready
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      # ── Cypress ──
      - name: Install Cypress binary
        working-directory: frontend
        run: npx cypress install

      - name: Run Cypress E2E tests
        working-directory: frontend
        run: npx cypress run --browser chrome
        env:
          CYPRESS_baseUrl: http://localhost:3000

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/
          retention-days: 7

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos/
          retention-days: 3

      # ── Cleanup ──
      - name: Stop servers
        if: always()
        run: |
          kill ${{ env.BACKEND_PID }} 2>/dev/null || true
          kill ${{ env.FRONTEND_PID }} 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════════════════
  # SECURITY
  # ═══════════════════════════════════════════════════════════════════════════
  security-scan:
    name: Security — Trivy vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE — must pass before merge
  # ═══════════════════════════════════════════════════════════════════════════
  ci-gate:
    name: CI gate — all checks passed
    runs-on: ubuntu-latest
    if: always()
    needs: [backend-test, backend-audit, frontend-test, frontend-build, frontend-audit, tech-hub-build, e2e-test, security-scan]
    steps:
      - name: Check all required jobs passed
        run: |
          echo "Backend test:     ${{ needs.backend-test.result }}"
          echo "Backend audit:    ${{ needs.backend-audit.result }}"
          echo "Frontend test:    ${{ needs.frontend-test.result }}"
          echo "Frontend build:   ${{ needs.frontend-build.result }}"
          echo "Frontend audit:   ${{ needs.frontend-audit.result }}"
          echo "E2E test:         ${{ needs.e2e-test.result }}"
          echo "Security scan:    ${{ needs.security-scan.result }}"

          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then
            echo "::error::Backend tests failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-test.result }}" != "success" ]]; then
            echo "::error::Frontend tests failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "::error::Frontend build failed"
            exit 1
          fi
          # E2E and security are advisory for now
          echo "✅ All required checks passed"
