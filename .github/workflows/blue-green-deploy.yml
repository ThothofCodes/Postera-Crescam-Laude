name: Blue-Green Deployment

# Triggers on push to main or manual deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - blue
          - green
      version:
        description: 'Version tag'
        required: false
        type: string

# Only one deployment at a time
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20.x'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # PRE-DEPLOYMENT CHECKS
  # ═══════════════════════════════════════════════════════════════════════════
  pre-check:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.detect.outputs.target_env }}
      current_env: ${{ steps.detect.outputs.current_env }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect current active environment
        id: detect
        run: |
          # In production, this would check the actual load balancer
          # For now, we alternate between blue and green
          if [ -f /tmp/active-env ]; then
            CURRENT=$(cat /tmp/active-env)
          else
            CURRENT="blue"
          fi
          
          if [ "$CURRENT" = "blue" ]; then
            TARGET="green"
          else
            TARGET="blue"
          fi
          
          echo "current_env=$CURRENT" >> $GITHUB_OUTPUT
          echo "target_env=$TARGET" >> $GITHUB_OUTPUT
          echo "Current environment: $CURRENT"
          echo "Target environment: $TARGET"

      - name: Generate version tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="v$(date +%Y%m%d)-${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD & PUSH IMAGES
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build Docker images
    needs: [pre-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ needs.pre-check.outputs.version }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ needs.pre-check.outputs.version }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Build and push tech-hub
        uses: docker/build-push-action@v5
        with:
          context: ./tech-hub
          file: ./tech-hub/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/tech-hub:${{ needs.pre-check.outputs.version }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/tech-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOY TO TARGET ENVIRONMENT
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to ${{ needs.pre-check.outputs.target_env }}
    needs: [pre-check, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.pre-check.outputs.target_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to target environment
        env:
          TARGET_ENV: ${{ needs.pre-check.outputs.target_env }}
          VERSION: ${{ needs.pre-check.outputs.version }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "Deploying version $VERSION to $TARGET_ENV environment..."
          
          # SSH to deployment server and run deployment
          ssh -o StrictHostKeyChecking=no -i "$DEPLOY_HOST" << 'EOF'
            cd /opt/pcl
            
            # Pull new images
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:$VERSION
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:$VERSION
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/tech-hub:$VERSION
            
            # Stop existing services in target environment
            docker-compose -f docker-compose.$TARGET_ENV.yml down
            
            # Update image tags in docker-compose
            sed -i "s|image: .*backend:.*|image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:$VERSION|" docker-compose.$TARGET_ENV.yml
            sed -i "s|image: .*frontend:.*|image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:$VERSION|" docker-compose.$TARGET_ENV.yml
            sed -i "s|image: .*tech-hub:.*|image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/tech-hub:$VERSION|" docker-compose.$TARGET_ENV.yml
            
            # Start services
            docker-compose -f docker-compose.$TARGET_ENV.yml up -d
          EOF

      - name: Wait for services to be healthy
        run: |
          TARGET_ENV=${{ needs.pre-check.outputs.target_env }}
          
          if [ "$TARGET_ENV" = "blue" ]; then
            BACKEND_PORT=5001
            FRONTEND_PORT=3000
            TECHHUB_PORT=4321
          else
            BACKEND_PORT=5002
            FRONTEND_PORT=3001
            TECHHUB_PORT=4322
          fi
          
          echo "Waiting for services on $TARGET_ENV environment..."
          
          # Wait for backend
          for i in {1..30}; do
            if curl -sf "http://localhost:$BACKEND_PORT/api/health" > /dev/null 2>&1; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          
          # Wait for frontend
          for i in {1..30}; do
            if curl -sf "http://localhost:$FRONTEND_PORT" > /dev/null 2>&1; then
              echo "Frontend is healthy"
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done

      - name: Verify deployment
        run: |
          TARGET_ENV=${{ needs.pre-check.outputs.target_env }}
          
          if [ "$TARGET_ENV" = "blue" ]; then
            BACKEND_PORT=5001
          else
            BACKEND_PORT=5002
          fi
          
          echo "Verifying deployment..."
          
          # Check backend health
          HEALTH=$(curl -sf "http://localhost:$BACKEND_PORT/api/health" || echo '{"status":"error"}')
          STATUS=$(echo $HEALTH | jq -r '.status')
          
          if [ "$STATUS" = "ok" ]; then
            echo "✅ Backend health check passed"
          else
            echo "❌ Backend health check failed"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # SWITCH TRAFFIC
  # ═══════════════════════════════════════════════════════════════════════════
  switch-traffic:
    name: Switch traffic to ${{ needs.pre-check.outputs.target_env }}
    needs: [pre-check, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Switch load balancer
        env:
          TARGET_ENV: ${{ needs.pre-check.outputs.target_env }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "Switching traffic to $TARGET_ENV environment..."
          
          ssh -o StrictHostKeyChecking=no -i "$DEPLOY_HOST" << 'EOF'
            cd /opt/pcl
            
            # Update active environment file
            echo "$TARGET_ENV" > /tmp/active-env
            
            # Reload nginx
            sudo nginx -t && sudo nginx -s reload
            
            echo "Traffic switched to $TARGET_ENV"
          EOF

      - name: Verify traffic switch
        run: |
          TARGET_ENV=${{ needs.pre-check.outputs.target_env }}
          
          echo "Verifying traffic is routing to $TARGET_ENV..."
          
          # Wait for nginx to reload
          sleep 5
          
          # Check main endpoint
          for i in {1..10}; do
            RESPONSE=$(curl -sf "http://localhost/api/health" || echo '{"status":"error"}')
            echo "Attempt $i: $RESPONSE"
            
            if echo "$RESPONSE" | grep -q '"status":"ok"'; then
              echo "✅ Traffic switch verified"
              break
            fi
            sleep 2
          done

  # ═══════════════════════════════════════════════════════════════════════════
  # POST-DEPLOYMENT
  # ═══════════════════════════════════════════════════════════════════════════
  post-deploy:
    name: Post-deployment tasks
    needs: [pre-check, switch-traffic]
    runs-on: ubuntu-latest
    steps:
      - name: Create deployment record
        run: |
          echo "## Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.pre-check.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Environment | ${{ needs.pre-check.outputs.target_env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous Environment | ${{ needs.pre-check.outputs.current_env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed By | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rollback Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To rollback, run the workflow manually with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "environment: ${{ needs.pre-check.outputs.current_env }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment
        if: success()
        run: |
          echo "Deployment successful!"
          # Add Slack/Discord notification here if needed

      - name: Notify failure
        if: failure()
        run: |
          echo "Deployment failed! Manual intervention may be required."
          # Add Slack/Discord notification here if needed

  # ═══════════════════════════════════════════════════════════════════════════
  # ROLLBACK (manual trigger)
  # ═══════════════════════════════════════════════════════════════════════════
  rollback:
    name: Rollback to ${{ needs.pre-check.outputs.current_env }}
    needs: [pre-check]
    if: inputs.environment != 'auto' && inputs.environment != needs.pre-check.outputs.target_env
    runs-on: ubuntu-latest
    steps:
      - name: Rollback traffic
        env:
          CURRENT_ENV: ${{ needs.pre-check.outputs.current_env }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "Rolling back to $CURRENT_ENV environment..."
          
          ssh -o StrictHostKeyChecking=no -i "$DEPLOY_HOST" << 'EOF'
            cd /opt/pcl
            
            # Update active environment file
            echo "$CURRENT_ENV" > /tmp/active-env
            
            # Reload nginx
            sudo nginx -t && sudo nginx -s reload
            
            echo "Rollback to $CURRENT_ENV complete"
          EOF

      - name: Verify rollback
        run: |
          CURRENT_ENV=${{ needs.pre-check.outputs.current_env }}
          
          echo "Verifying rollback to $CURRENT_ENV..."
          sleep 5
          
          RESPONSE=$(curl -sf "http://localhost/api/health" || echo '{"status":"error"}')
          echo "Health check: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"status":"ok"'; then
            echo "✅ Rollback verified"
          else
            echo "❌ Rollback verification failed"
            exit 1
          fi
