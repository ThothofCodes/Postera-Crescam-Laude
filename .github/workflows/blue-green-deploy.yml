name: Blue-Green Deployment

# Only manual trigger or push to main
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (auto = alternate, blue/green = specific)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - blue
          - green
      version:
        description: 'Version tag (optional)'
        required: false
        type: string

# Only one deployment at a time
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '22.x'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # PRE-DEPLOYMENT CHECKS
  # ═══════════════════════════════════════════════════════════════════════════
  pre-check:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.detect.outputs.target_env }}
      current_env: ${{ steps.detect.outputs.current_env }}
      version: ${{ steps.version.outputs.version }}
      repo_lower: ${{ steps.repo.outputs.repo_lower }}
      has_deploy_secrets: ${{ steps.secrets.outputs.has_secrets }}
    steps:
      - uses: actions/checkout@v4

      - name: Check available secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️  DEPLOY_HOST not configured — will build only"
          fi

      - name: Detect current active environment
        id: detect
        run: |
          # For auto mode, alternate between blue and green
          if [ "${{ inputs.environment }}" = "auto" ] || [ -z "${{ inputs.environment }}" ]; then
            # Default to green on first run
            CURRENT="blue"
            TARGET="green"
          elif [ "${{ inputs.environment }}" = "blue" ]; then
            CURRENT="green"
            TARGET="blue"
          else
            CURRENT="blue"
            TARGET="green"
          fi
          
          echo "current_env=$CURRENT" >> $GITHUB_OUTPUT
          echo "target_env=$TARGET" >> $GITHUB_OUTPUT
          echo "Current environment: $CURRENT"
          echo "Target environment: $TARGET"

      - name: Generate version tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="v$(date +%Y%m%d)-${GITHUB_SHA::8}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Lowercase repository name
        id: repo
        run: echo "repo_lower=$(echo "${{ github.repository }}" | tr [:upper:] [:lower:])" >> $GITHUB_OUTPUT
  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD & PUSH IMAGES (always runs)
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build Docker images
    needs: [pre-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.pre-check.outputs.repo_lower }}/backend:${{ needs.pre-check.outputs.version }}
            ghcr.io/${{ needs.pre-check.outputs.repo_lower }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.pre-check.outputs.repo_lower }}/frontend:${{ needs.pre-check.outputs.version }}
            ghcr.io/${{ needs.pre-check.outputs.repo_lower }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || 'http://localhost:5001' }}

      - name: Build and push tech-hub
        uses: docker/build-push-action@v5
        with:
          context: ./tech-hub
          file: ./tech-hub/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.pre-check.outputs.repo_lower }}/tech-hub:${{ needs.pre-check.outputs.version }}
            ghcr.io/${{ needs.pre-check.outputs.repo_lower }}/tech-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOY (only if secrets are configured)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to ${{ needs.pre-check.outputs.target_env }}
    needs: [pre-check, build]
    if: needs.pre-check.outputs.has_deploy_secrets == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.pre-check.outputs.target_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to target environment
        env:
          TARGET_ENV: ${{ needs.pre-check.outputs.target_env }}
          VERSION: ${{ needs.pre-check.outputs.version }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Deploying version $VERSION to $TARGET_ENV environment..."
          
          # SSH to deployment server
          ssh -o StrictHostKeyChecking=no $DEPLOY_HOST << 'EOF'
            cd /opt/pcl
            
            # Pull new images
            docker pull ghcr.io/${{ needs.pre-check.outputs.repo_lower }}/backend:$VERSION
            docker pull ghcr.io/${{ needs.pre-check.outputs.repo_lower }}/frontend:$VERSION
            docker pull ghcr.io/${{ needs.pre-check.outputs.repo_lower }}/tech-hub:$VERSION
            
            # Stop existing services in target environment
            docker-compose -f docker-compose.$TARGET_ENV.yml down || true
            
            # Start services with new images
            docker-compose -f docker-compose.$TARGET_ENV.yml up -d
            
            echo "✅ Deployment to $TARGET_ENV complete"
          EOF

      - name: Wait for services
        run: |
          TARGET_ENV=${{ needs.pre-check.outputs.target_env }}
          
          if [ "$TARGET_ENV" = "blue" ]; then
            BACKEND_PORT=5001
          else
            BACKEND_PORT=5002
          fi
          
          echo "Waiting for backend on port $BACKEND_PORT..."
          for i in {1..30}; do
            if curl -sf "http://localhost:$BACKEND_PORT/api/health" > /dev/null 2>&1; then
              echo "✅ Backend is healthy"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

  # ═══════════════════════════════════════════════════════════════════════════
  # SWITCH TRAFFIC (only if deploy succeeded)
  # ═══════════════════════════════════════════════════════════════════════════
  switch-traffic:
    name: Switch traffic to ${{ needs.pre-check.outputs.target_env }}
    needs: [pre-check, deploy]
    if: needs.pre-check.outputs.has_deploy_secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Switch load balancer
        env:
          TARGET_ENV: ${{ needs.pre-check.outputs.target_env }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Switching traffic to $TARGET_ENV environment..."
          
          ssh -o StrictHostKeyChecking=no $DEPLOY_HOST << 'EOF'
            cd /opt/pcl
            
            # Update active environment
            echo "$TARGET_ENV" > /tmp/active-env
            
            # Reload nginx
            sudo nginx -t && sudo nginx -s reload
            
            echo "✅ Traffic switched to $TARGET_ENV"
          EOF

  # ═══════════════════════════════════════════════════════════════════════════
  # POST-DEPLOYMENT (always runs)
  # ═══════════════════════════════════════════════════════════════════════════
  post-deploy:
    name: Post-deployment summary
    needs: [pre-check, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.pre-check.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Environment | \`${{ needs.pre-check.outputs.target_env }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Status | \`${{ needs.build.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Status | \`${{ needs.deploy.result || 'skipped (no deploy secrets)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.pre-check.outputs.has_deploy_secrets }}" = "false" ]; then
            echo "### ⚠️ Build Only Mode" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Docker images were built and pushed to \`ghcr.io\`." >> $GITHUB_STEP_SUMMARY
            echo "To deploy, configure these GitHub secrets:" >> $GITHUB_STEP_SUMMARY
            echo "- \`DEPLOY_HOST\` - SSH host for deployment server" >> $GITHUB_STEP_SUMMARY
          fi
