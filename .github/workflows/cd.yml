name: CD — Deploy

# Deploys after CI passes on main, or on manual trigger / release.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  release:
    types: [published]

# Only one deploy at a time — cancel stale deploys for the same ref
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # don't cancel mid-deploy — let it finish

env:
  NODE_VERSION: '20.x'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # GATE — verify CI passed before deploying
  # ═══════════════════════════════════════════════════════════════════════════
  verify-ci:
    name: Verify CI passed
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        run: |
          # This job exists so downstream jobs can `needs: [verify-ci]`
          # GitHub Actions won't run jobs if the workflow was triggered by push
          # but we add this as a safety net for manual triggers
          echo "CI verification passed — proceeding with deployment"

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND DEPLOYMENT
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-backend:
    name: Deploy backend
    needs: [verify-ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # ── PythonAnywhere ──
      - name: Deploy to PythonAnywhere
        if: ${{ secrets.PYTHONANYWHERE_API_TOKEN != '' }}
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
          PA_HOST: ${{ secrets.PYTHONANYWHERE_HOST || 'www.pythonanywhere.com' }}
        run: |
          echo "Deploying backend to PythonAnywhere..."

          # Reload the web app
          RESPONSE=$(curl -s -o /tmp/pa-response.json -w "%{http_code}" -X POST \
            "https://${PA_HOST}/api/v0/user/${PA_USERNAME}/webapps/${PA_DOMAIN}/reload/" \
            -H "Authorization: Token ${PA_TOKEN}")
          echo "Reload response: ${RESPONSE}"
          cat /tmp/pa-response.json

          if [ "${RESPONSE}" != "200" ]; then
            echo "::error::PythonAnywhere reload failed with status ${RESPONSE}"
            exit 1
          fi
          echo "✅ PythonAnywhere reloaded successfully"

      # ── Render ──
      - name: Deploy to Render
        if: ${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != '' }}
        run: |
          echo "Deploying backend to Render..."
          
          RESPONSE=$(curl -s -o /tmp/render-response.json -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          
          echo "Deploy response: ${RESPONSE}"
          cat /tmp/render-response.json
          
          if [ "${RESPONSE}" != "201" ]; then
            echo "::error::Render deploy failed with status ${RESPONSE}"
            exit 1
          fi
          echo "✅ Render deploy triggered successfully"
          
          # Wait for deploy to complete
          sleep 30
          
          # Check service status
          STATUS_RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}")
          echo "Service status: $(echo $STATUS_RESPONSE | jq -r '.state')"
          
      # ── Cyclic.sh (alternative free tier) ──
      - name: Deploy to Cyclic
        if: ${{ secrets.CYCLIC_API_KEY != '' && secrets.CYCLIC_APP_NAME != '' }}
        run: |
          echo "Deploying backend to Cyclic.sh..."
          
          # Cyclic auto-deploys from GitHub on push
          # Just verify the service is running
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.CYCLIC_APP_NAME }}.cyclic.app/api/health" || echo "000")
          
          if [ "${RESPONSE}" = "200" ]; then
            echo "✅ Cyclic service is healthy"
          else
            echo "⚠️ Cyclic health check returned ${RESPONSE} — service may be cold starting"
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND DEPLOYMENT
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-frontend:
    name: Deploy frontend
    needs: [verify-ci]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ── Vercel ──
      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  # ═══════════════════════════════════════════════════════════════════════════
  # TECH HUB DEPLOYMENT
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-tech-hub:
    name: Deploy Tech Hub
    needs: [verify-ci]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: tech-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tech-hub/package-lock.json

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}

      # ── Netlify ──
      - name: Deploy to Netlify
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_TECH_HUB_SITE_ID != '' }}
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./dist
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Tech Hub deploy from ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TECH_HUB_SITE_ID }}

  # ═══════════════════════════════════════════════════════════════════════════
  # DOCKER (optional — for self-hosted or Kubernetes deployments)
  # ═══════════════════════════════════════════════════════════════════════════
  docker-build:
    name: Build & push Docker images
    needs: [deploy-backend, deploy-frontend, deploy-tech-hub]
    if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ruaitech-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ruaitech-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ruaitech-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ruaitech-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push tech-hub image
        uses: docker/build-push-action@v5
        with:
          context: ./tech-hub
          file: ./tech-hub/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pcl-tech-hub:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pcl-tech-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # POST-DEPLOY
  # ═══════════════════════════════════════════════════════════════════════════
  post-deploy:
    name: Post-deploy verification
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verify backend health
        if: ${{ secrets.BACKEND_URL != '' }}
        run: |
          echo "Checking backend health at ${{ secrets.BACKEND_URL }}..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy (attempt ${i})"
              exit 0
            fi
            echo "Attempt ${i}: status ${STATUS}, retrying in 10s..."
            sleep 10
          done
          echo "::warning::Backend health check did not pass after 5 attempts"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker-build.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
