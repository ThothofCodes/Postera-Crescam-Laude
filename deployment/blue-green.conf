# Blue-Green Deployment Nginx Configuration
# ============================================
# This configuration enables zero-downtime deployments by routing traffic
# between "blue" and "green" environments.

# Upstream definitions for blue and green backends
upstream backend_blue {
    server backend-blue:5001;
    keepalive 32;
}

upstream backend_green {
    server backend-green:5001;
    keepalive 32;
}

# Active backend (controlled by deployment script)
# This file is updated by the deployment orchestrator
include /etc/nginx/conf.d/active-backend.conf;

# Frontend upstreams
upstream frontend_blue {
    server frontend-blue:80;
    keepalive 32;
}

upstream frontend_green {
    server frontend-green:80;
    keepalive 32;
}

# Tech Hub upstreams
upstream techhub_blue {
    server techhub-blue:80;
    keepalive 32;
}

upstream techhub_green {
    server techhub-green:80;
    keepalive 32;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# Main server block
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Health check endpoint (always available)
    location /health {
        access_log off;
        return 200 '{"status":"ok","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Deployment status endpoint
    location /deployment/status {
        access_log off;
        return 200 '{"blue":{"status":"active"},"green":{"status":"standby"}}';
        add_header Content-Type application/json;
    }

    # API routes -> Backend
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://$active_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Socket.IO routes
    location /socket.io/ {
        proxy_pass http://$active_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long polling fallback
        proxy_read_timeout 86400;
    }

    # Tech Hub (blog.yourstore.com or /tech-hub)
    location /tech-hub {
        limit_req zone=general burst=10 nodelay;

        proxy_pass http://$active_techhub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (everything else)
    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://$active_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://$active_frontend;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
