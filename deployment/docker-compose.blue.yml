# Blue Environment Docker Compose
# ================================
# This file defines the blue environment for blue-green deployments.
# Blue runs on default ports: 5001, 3000, 4321

version: '3.8'

services:
  # Backend API - Blue
  backend-blue:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend-blue
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=http://localhost:3000
      - DEPLOYMENT_ENV=blue
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - blue-network

  # Frontend - Blue
  frontend-blue:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend-blue
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:5001
      - DEPLOYMENT_ENV=blue
    depends_on:
      backend-blue:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - blue-network

  # Tech Hub - Blue
  techhub-blue:
    build:
      context: ../tech-hub
      dockerfile: Dockerfile
    container_name: techhub-blue
    ports:
      - "4321:80"
    environment:
      - PUBLIC_SANITY_PROJECT_ID=${SANITY_PROJECT_ID}
      - PUBLIC_SANITY_DATASET=${SANITY_DATASET:-production}
      - DEPLOYMENT_ENV=blue
    restart: unless-stopped
    networks:
      - blue-network

  # MongoDB - Shared
  mongo:
    image: mongo:7
    container_name: mongo-shared
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - blue-network
      - green-network

  # Redis - Shared
  redis:
    image: redis:7-alpine
    container_name: redis-shared
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blue-network
      - green-network

networks:
  blue-network:
    driver: bridge
  green-network:
    driver: bridge
    external: true

volumes:
  mongo_data:
  redis_data:
