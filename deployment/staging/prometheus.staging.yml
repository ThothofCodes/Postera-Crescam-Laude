# Prometheus Configuration for Staging Environment
# =================================================
# Monitors all staging services and collects metrics.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules
rule_files:
  # - "staging_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus-staging'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'staging'

  # Backend API
  - job_name: 'backend-staging'
    static_configs:
      - targets: ['backend-staging:5001']
        labels:
          environment: 'staging'
          service: 'backend'
    metrics_path: '/api/health'
    scrape_interval: 30s

  # MongoDB Exporter (if deployed)
  - job_name: 'mongodb-staging'
    static_configs:
      - targets: ['mongo-exporter:9216']
        labels:
          environment: 'staging'
          service: 'mongodb'

  # Redis Exporter (if deployed)
  - job_name: 'redis-staging'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          environment: 'staging'
          service: 'redis'

  # Node Exporter (if deployed)
  - job_name: 'node-staging'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          environment: 'staging'
          service: 'node'

# Scrape configs for custom metrics
  - job_name: 'app-metrics-staging'
    static_configs:
      - targets: ['backend-staging:5001']
        labels:
          environment: 'staging'
          service: 'backend'
          metric_type: 'application'
    metrics_path: '/metrics'
    scrape_interval: 30s

# Staging-specific scrape configs
  - job_name: 'staging-health'
    static_configs:
      - targets: ['backend-staging:5001', 'frontend-staging:80', 'techhub-staging:80']
        labels:
          environment: 'staging'
    metrics_path: '/health'
    scrape_interval: 60s
