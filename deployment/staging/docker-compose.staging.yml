# Staging Environment Docker Compose
# ====================================
# This file defines the staging environment with separate MongoDB instance.
# Staging mirrors production but with isolated data and lower resources.

version: '3.8'

services:
  # Backend API - Staging
  backend-staging:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: production
    container_name: backend-staging
    ports:
      - "5010:5001"
    environment:
      - NODE_ENV=staging
      - PORT=5001
      - MONGO_URI=mongodb://mongo-staging:27017/pcl_staging
      - JWT_SECRET=${STAGING_JWT_SECRET:-staging-jwt-secret-change-in-production}
      - CLIENT_URL=http://localhost:3010
      - DEPLOYMENT_ENV=staging
      - MPESA_ENV=sandbox
      - AT_ENV=sandbox
      - LOG_LEVEL=debug
    depends_on:
      mongo-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - staging-network
    volumes:
      - staging-logs:/app/logs

  # Frontend - Staging
  frontend-staging:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5010
    container_name: frontend-staging
    ports:
      - "3010:80"
    environment:
      - VITE_API_URL=http://localhost:5010
      - DEPLOYMENT_ENV=staging
    depends_on:
      backend-staging:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - staging-network

  # Tech Hub - Staging
  techhub-staging:
    build:
      context: ../../tech-hub
      dockerfile: Dockerfile
    container_name: techhub-staging
    ports:
      - "4330:80"
    environment:
      - PUBLIC_SANITY_PROJECT_ID=${STAGING_SANITY_PROJECT_ID}
      - PUBLIC_SANITY_DATASET=staging
      - DEPLOYMENT_ENV=staging
    restart: unless-stopped
    networks:
      - staging-network

  # MongoDB - Staging (separate from production)
  mongo-staging:
    image: mongo:7
    container_name: mongo-staging
    ports:
      - "27018:27017"
    volumes:
      - staging-mongo-data:/data/db
      - staging-mongo-config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=pcl_staging
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - staging-network
    command: ["--wiredTigerCacheSizeGB=0.25", "--maxConns=100"]

  # Redis - Staging (separate from production)
  redis-staging:
    image: redis:7-alpine
    container_name: redis-staging
    ports:
      - "6380:6379"
    volumes:
      - staging-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  # Nginx - Staging
  nginx-staging:
    image: nginx:alpine
    container_name: nginx-staging
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - staging-ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend-staging
      - frontend-staging
      - techhub-staging
    restart: unless-stopped
    networks:
      - staging-network

  # Monitoring - Staging
  prometheus-staging:
    image: prom/prometheus:latest
    container_name: prometheus-staging
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro
      - staging-prometheus-data:/prometheus
    networks:
      - staging-network

  grafana-staging:
    image: grafana/grafana:latest
    container_name: grafana-staging
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${STAGING_GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - staging-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus-staging
    networks:
      - staging-network

networks:
  staging-network:
    driver: bridge

volumes:
  staging-mongo-data:
  staging-mongo-config:
  staging-redis-data:
  staging-logs:
  staging-ssl:
  staging-prometheus-data:
  staging-grafana-data:
