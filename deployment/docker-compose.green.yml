# Green Environment Docker Compose
# =================================
# This file defines the green environment for blue-green deployments.
# Green runs on offset ports: 5002, 3001, 4322

version: '3.8'

services:
  # Backend API - Green
  backend-green:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend-green
    ports:
      - "5002:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=http://localhost:3001
      - DEPLOYMENT_ENV=green
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - green-network

  # Frontend - Green
  frontend-green:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend-green
    ports:
      - "3001:80"
    environment:
      - VITE_API_URL=http://localhost:5002
      - DEPLOYMENT_ENV=green
    depends_on:
      backend-green:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - green-network

  # Tech Hub - Green
  techhub-green:
    build:
      context: ../tech-hub
      dockerfile: Dockerfile
    container_name: techhub-green
    ports:
      - "4322:80"
    environment:
      - PUBLIC_SANITY_PROJECT_ID=${SANITY_PROJECT_ID}
      - PUBLIC_SANITY_DATASET=${SANITY_DATASET:-production}
      - DEPLOYMENT_ENV=green
    restart: unless-stopped
    networks:
      - green-network

networks:
  green-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
